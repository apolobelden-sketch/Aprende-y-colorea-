<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trazos con Palabras - Aprende a Escribir</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #fef9f0; margin: 0; padding: 20px; }
  h1 { color: #d35400; }
  .volver { display: inline-block; margin-bottom: 15px; color: #d35400; text-decoration: none; font-weight: bold; }
  #cuadricula { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 560px; margin: 12px auto; }
  #cuadricula button { width: 36px; height: 36px; border-radius: 8px; border: 2px solid #d35400; background: white; color: #d35400; font-size: 15px; font-weight: bold; cursor: pointer; }
  #cuadricula button.actual { background: #d35400; color: white; }
  #lienzoContenedor { display: inline-block; border: 3px solid #333; border-radius: 10px; background: white; margin-top: 10px; max-width: 95vw; overflow: hidden; }
  canvas { cursor: crosshair; max-width: 100%; height: auto; display: block; touch-action: none; }
  .accion { padding: 10px 18px; margin: 5px; border-radius: 8px; border: none; background: #27ae60; color: white; font-size: 15px; cursor: pointer; }
  #palabraActual { font-size: 20px; color: #888; margin: 6px 0; }
</style>
</head>
<body>

<a class="volver" href="index.html">← Volver al inicio</a>
<h1>✏️ Trazos con Palabras</h1>
<p style="color:#888; font-size:14px;">Traza la primera letra punteada — el resto de la palabra ya está escrito para que la reconozcas.</p>

<div id="cuadricula"></div>

<p id="palabraActual">árbol</p>

<div id="lienzoContenedor">
  <canvas id="lienzo" width="700" height="300"></canvas>
</div>

<br>
<button class="accion" id="otraLetraBtn" style="background:#3498db;">🔀 Otra palabra de esta letra</button>
<button class="accion" id="aleatorioBtn" style="background:#8e44ad;">🎲 Palabra aleatoria (cualquier letra)</button>
<br>
<button class="accion" id="limpiarBtn" style="background:#e67e22;">↺ Limpiar trazo</button>
<button class="accion" id="imprimirBtn">🖨️ Imprimir</button>

<script>
const canvas = document.getElementById('lienzo');
const ctx = canvas.getContext('2d');
const cuadricula = document.getElementById('cuadricula');
const palabraActualTexto = document.getElementById('palabraActual');

const bancoPalabras = {
  a: ['árbol','avión','araña','abeja','anillo'],
  b: ['barco','bota','banana','ballena','bicicleta'],
  c: ['casa','carro','conejo','cielo','camión'],
  d: ['dado','delfín','dedo','domingo','doctor'],
  e: ['elefante','escuela','estrella','espejo','erizo'],
  f: ['flor','foca','fresa','foco','fantasma'],
  g: ['gato','globo','guitarra','gallina','gorra'],
  h: ['helado','hormiga','huevo','hoja','hospital'],
  i: ['iglesia','isla','imán','insecto','iguana'],
  j: ['jirafa','jardín','jabón','juguete','jaula'],
  k: ['kilo','koala'],
  l: ['luna','león','libro','lápiz','luz'],
  m: ['mesa','mariposa','mono','manzana','mochila'],
  n: ['nube','nido','naranja','nariz','nieve'],
  o: ['oso','ojo','oveja','olla','oruga'],
  p: ['pato','perro','pelota','pescado','payaso'],
  q: ['queso','quince'],
  r: ['ratón','rana','robot','radio','regalo'],
  s: ['sol','silla','serpiente','sombrero','sandía'],
  t: ['tren','tortuga','taza','tigre','tambor'],
  u: ['uva','uña','unicornio','uniforme','universo'],
  v: ['vaca','vela','ventana','violín','vestido'],
  w: ['wafle'],
  x: ['xilófono'],
  y: ['yoyo','yate'],
  z: ['zapato','zorro','zanahoria','zoológico']
};

const letras = Object.keys(bancoPalabras);
let letraActual = 'a';
let palabraActual = bancoPalabras['a'][0];

function elegirPalabraAlAzar(letra) {
  const lista = bancoPalabras[letra];
  return lista[Math.floor(Math.random() * lista.length)];
}

function dibujarPalabra() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  palabraActualTexto.textContent = palabraActual;

  const primera = palabraActual[0];
  const resto = palabraActual.slice(1);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 170px Arial';
  const anchoPrimera = ctx.measureText(primera).width;
  ctx.font = 'bold 70px Arial';
  const anchoResto = ctx.measureText(resto).width;

  const anchoTotal = anchoPrimera + anchoResto;
  let x = (canvas.width - anchoTotal) / 2;
  const y = canvas.height / 2;

  // Primera letra: punteada, para trazar
  ctx.font = 'bold 170px Arial';
  ctx.setLineDash([10, 8]);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#cccccc';
  ctx.strokeText(primera, x, y);
  ctx.setLineDash([]);

  // Resto de la palabra: sólida, para leer
  x += anchoPrimera;
  ctx.font = 'bold 70px Arial';
  ctx.fillStyle = '#d35400';
  ctx.fillText(resto, x, y);
}

function construirCuadricula() {
  cuadricula.innerHTML = '';
  letras.forEach((letra) => {
    const btn = document.createElement('button');
    btn.textContent = letra.toUpperCase();
    if (letra === letraActual) btn.classList.add('actual');
    btn.onclick = () => {
      letraActual = letra;
      palabraActual = elegirPalabraAlAzar(letra);
      dibujarPalabra();
      construirCuadricula();
    };
    cuadricula.appendChild(btn);
  });
}

document.getElementById('otraLetraBtn').onclick = () => {
  palabraActual = elegirPalabraAlAzar(letraActual);
  dibujarPalabra();
};

document.getElementById('aleatorioBtn').onclick = () => {
  letraActual = letras[Math.floor(Math.random() * letras.length)];
  palabraActual = elegirPalabraAlAzar(letraActual);
  dibujarPalabra();
  construirCuadricula();
};

document.getElementById('limpiarBtn').onclick = dibujarPalabra;

document.getElementById('imprimirBtn').onclick = () => {
  const ventana = window.open('');
  ventana.document.write('<img src="' + canvas.toDataURL() + '" style="width:100%">');
  ventana.print();
};

// Trazo con el dedo/mouse
let dibujando = false;
let ultimoPunto = null;

function obtenerPosicion(e) {
  const rect = canvas.getBoundingClientRect();
  const escalaX = canvas.width / rect.width;
  const escalaY = canvas.height / rect.height;
  const clienteX = e.touches ? e.touches[0].clientX : e.clientX;
  const clienteY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clienteX - rect.left) * escalaX,
    y: (clienteY - rect.top) * escalaY
  };
}

canvas.addEventListener('pointerdown', (e) => {
  dibujando = true;
  ultimoPunto = obtenerPosicion(e);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dibujando) return;
  const pos = obtenerPosicion(e);
  ctx.strokeStyle = '#3498db';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(ultimoPunto.x, ultimoPunto.y);
  ctx.lineTo(pos.x, pos.y);
  ctx.stroke();
  ultimoPunto = pos;
});
canvas.addEventListener('pointerup', () => { dibujando = false; });
canvas.addEventListener('pointerleave', () => { dibujando = false; });

dibujarPalabra();
construirCuadricula();
</script>

</body>
  </html>
