<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pregúntale al profe</title>
<style>
  body { font-family: Arial, sans-serif; background: #fef9f0; margin: 0; padding: 20px; color: #333; }
  .caja { max-width: 560px; margin: 0 auto; }
  h1 { color: #d35400; text-align: center; }
  .volver { display: inline-block; margin-bottom: 14px; color: #d35400; text-decoration: none; font-weight: bold; }
  .entrada { display: flex; gap: 8px; }
  input { flex: 1; font-size: 1.05rem; padding: 12px; border: 2px solid #d35400; border-radius: 10px; min-width: 0; }
  button { font-size: 1rem; font-weight: bold; padding: 12px 16px; border: 0; border-radius: 10px; background: #d35400; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .chip { background: #fff; color: #d35400; border: 2px solid #d35400; font-weight: normal; padding: 8px 12px; border-radius: 999px; font-size: .9rem; }
  .aviso { font-size: .85rem; color: #666; margin: 10px 0; }
  #resultado { background: #fff; border: 2px solid #d35400; border-radius: 12px; padding: 16px; margin-top: 14px; display: none; }
  #resultado h2 { color: #d35400; margin: 0 0 6px; font-size: 1.25rem; }
  #resultado h3 { margin: 14px 0 4px; font-size: 1.05rem; }
  .linea { font-size: 1.15rem; padding: 3px 0; border-bottom: 1px dashed #eee; }
  .texto { white-space: pre-wrap; line-height: 1.5; font-size: 1.05rem; }
  .sello { display: inline-block; font-size: .8rem; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; }
  .ok { background: #e6f7ec; color: #1b7a3d; }
  .ia { background: #fff3cd; color: #8a6d00; }
  .error { color: #b00020; font-weight: bold; }
  .acciones { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .sec { background: #fff; color: #d35400; border: 2px solid #d35400; }
  @media print { .volver, .entrada, .chips, .aviso, .acciones, h1 { display: none; } #resultado { border: 0; } }
</style>
</head>
<body>
<div class="caja">
<a class="volver" href="index.html">← Volver al Módulo Educativo</a>
<h1>🤖 Pregúntale al profe</h1>
<div class="entrada">
  <input id="q" type="text" maxlength="200" placeholder="Ej: tabla del 7" autocomplete="off">
  <button id="ir" type="button">Preguntar</button>
</div>
<div class="chips" id="chips"></div>
<p class="aviso">Las tablas y los ejercicios los calcula el programa y están correctos. Las explicaciones las escribe una inteligencia artificial y puede equivocarse: revísalas con tu maestro o maestra. No escribas datos personales.</p>
<div id="resultado"></div>
</div>
<script>
const URL_SB='https://pnjglzuxsyahxcbgjwvq.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBuamdsenV4c3lhaHhjYmdqd3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NjI0ODcsImV4cCI6MjA5NzEzODQ4N30.iD-yLgcC5GiGWQseAykLnONTCr1qA7kXSWgqVQ3-gfM';
const EJEMPLOS=['Tabla del 7','Tablas del 2 al 5','10 sumas de 2 dígitos llevando','8 divisiones','¿Qué es un sustantivo?','¿Qué es una fracción?'];
const q=document.getElementById('q'),ir=document.getElementById('ir'),res=document.getElementById('resultado');
let respuestasVisibles=null;
EJEMPLOS.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.onclick=()=>{q.value=t;preguntar()};document.getElementById('chips').appendChild(b)});
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function mostrar(d){
  res.innerHTML='';res.style.display='block';
  if(d.error){res.appendChild(el('div','error',d.error));return}
  res.appendChild(el('span','sello '+(d.origen==='ia'?'ia':'ok'),d.origen==='ia'?'⚠️ Respuesta de una IA: revísala con tu maestro o maestra':'✅ Calculado con exactitud'));
  res.appendChild(el('h2',null,d.titulo||'Respuesta'));
  (d.bloques||[]).forEach(b=>{
    if(b.subtitulo) res.appendChild(el('h3',null,b.subtitulo));
    (b.lineas||[]).forEach(l=>res.appendChild(el('div','linea',l)));
  });
  if(d.texto) res.appendChild(el('div','texto',String(d.texto).replace(/\*\*/g,'').replace(/^#+\s*/gm,'')));
  const ac=el('div','acciones');
  if(d.respuestas&&d.respuestas.length){
    const cont=el('div',null);cont.style.display='none';
    d.respuestas.forEach(r=>cont.appendChild(el('div','linea',r)));
    const bv=el('button','sec','Ver respuestas');
    bv.onclick=()=>{const v=cont.style.display==='none';cont.style.display=v?'block':'none';bv.textContent=v?'Ocultar respuestas':'Ver respuestas'};
    ac.appendChild(bv);res.appendChild(ac);res.appendChild(cont);
  }
  const bp=el('button','sec','🖨️ Imprimir');bp.onclick=()=>window.print();ac.appendChild(bp);
  if(!ac.parentNode) res.appendChild(ac);
}
async function preguntar(){
  const texto=q.value.trim();
  if(!texto) return;
  ir.disabled=true;ir.textContent='Pensando…';
  res.style.display='block';res.innerHTML='';res.appendChild(el('div',null,'El profe está pensando…'));
  try{
    const r=await fetch(URL_SB+'/functions/v1/profe',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({pregunta:texto})});
    const d=await r.json().catch(()=>({error:'No se pudo leer la respuesta.'}));
    mostrar(d);
  }catch(e){
    mostrar({error:'No hay conexión. Revisa tu internet e inténtalo otra vez.'});
  }finally{ir.disabled=false;ir.textContent='Preguntar'}
}
ir.onclick=preguntar;
q.addEventListener('keydown',e=>{if(e.key==='Enter')preguntar()});
</script>
</body>
</html>
