<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprimir Ciencias - Secundaria</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #fef9f0; margin: 0; padding: 20px; }
  h1 { color: #d35400; }
  .volver { display: inline-block; margin-bottom: 15px; color: #d35400; text-decoration: none; font-weight: bold; }
  select, button { padding: 10px 14px; border-radius: 8px; border: 2px solid #d35400; font-size: 15px; margin: 5px; }
  button { background: #d35400; color: white; border: none; cursor: pointer; }
  button.secundario { background: #27ae60; }
  button.terciario { background: #8e44ad; }
  #hoja { background: white; max-width: 650px; margin: 20px auto; padding: 25px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); text-align: left; }
  #hoja h2 { text-align: center; color: #d35400; margin-top: 0; }
  #hoja .datos { display: flex; justify-content: space-between; font-size: 14px; color: #555; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
  #hoja .instruccion { font-size: 13px; color: #888; margin-bottom: 12px; }
  .problemas { display: flex; flex-direction: column; gap: 14px; }
  .problema { font-size: 17px; border: 1px solid #ddd; border-radius: 8px; padding: 12px 15px; }
  .problema .respuesta { color: #27ae60; font-weight: bold; display: none; }
  .mostrar-respuestas .respuesta { display: inline; }
  .mostrar-respuestas .linea { display: none; }
  .linea { display: inline-block; border-bottom: 2px solid #333; width: 140px; margin-left: 8px; }
  @media print {
    .no-imprimir { display: none; }
    body { background: white; padding: 0; }
    #hoja { box-shadow: none; margin: 0; max-width: 100%; }
  }
</style>
</head>
<body>

<a class="volver no-imprimir" href="index.html">← Volver a materias</a>
<h1 class="no-imprimir">🖨️ Hojas de Ciencias para Imprimir</h1>

<div class="no-imprimir">
  <label>Grado: </label>
  <select id="grado">
    <option value="1">1° Secundaria</option>
    <option value="2">2° Secundaria</option>
    <option value="3">3° Secundaria</option>
  </select>
  <br>
  <button id="generarBtn">🔄 Generar hoja nueva</button>
  <button class="secundario" id="imprimirBtn">🖨️ Imprimir</button>
  <button class="terciario" id="respuestasBtn">👁️ Ver respuestas</button>
</div>

<div id="hoja">
  <h2>Hoja de Ciencias — <span id="gradoTexto">1°</span> de Secundaria</h2>
  <div class="datos">
    <span>Nombre: <span class="linea" style="width:150px;"></span></span>
    <span>Fecha: <span class="linea" style="width:100px;"></span></span>
  </div>
  <p class="instruccion" id="instruccionTexto"></p>
  <div class="problemas" id="problemas"></div>
</div>

<script>
const problemasDiv = document.getElementById('problemas');
const gradoSelect = document.getElementById('grado');
const hoja = document.getElementById('hoja');
const instruccionTexto = document.getElementById('instruccionTexto');

function mezclar(arr) {
  const copia = [...arr];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

const bancos = {
  '1': {
    instruccion: 'Biología: responde cada pregunta.',
    items: [
      { texto: '¿Cuál es la unidad básica de todo ser vivo?', resp: 'la célula' },
      { texto: '¿Cómo se llama el proceso por el cual las plantas producen su alimento?', resp: 'fotosíntesis' },
      { texto: '¿Qué parte de la célula controla sus actividades?', resp: 'el núcleo' },
      { texto: '¿Cómo se llaman los organismos que producen su propio alimento?', resp: 'autótrofos' },
      { texto: '¿Qué sistema del cuerpo transporta la sangre?', resp: 'sistema circulatorio' },
      { texto: '¿Qué gas absorben las plantas durante la fotosíntesis?', resp: 'dióxido de carbono' },
      { texto: '¿Cómo se llama la reproducción sin participación de dos sexos?', resp: 'asexual' },
      { texto: '¿Qué órgano filtra la sangre y produce orina?', resp: 'el riñón' }
    ]
  },
  '2': {
    instruccion: 'Física: responde cada pregunta.',
    items: [
      { texto: '¿Cuál es la unidad de medida de la fuerza?', resp: 'newton' },
      { texto: '¿Cómo se llama la fuerza que atrae los objetos hacia la Tierra?', resp: 'gravedad' },
      { texto: '¿Cuáles son los tres estados básicos de la materia?', resp: 'sólido, líquido y gaseoso' },
      { texto: '¿Qué instrumento se usa para medir la temperatura?', resp: 'termómetro' },
      { texto: '¿Cómo se llama la energía asociada al movimiento?', resp: 'energía cinética' },
      { texto: '¿Qué ley dice que a toda acción corresponde una reacción igual y opuesta?', resp: 'tercera ley de Newton' },
      { texto: '¿Cuál es la fórmula de la velocidad?', resp: 'distancia entre tiempo' },
      { texto: '¿Cómo se llama el paso de líquido a gas?', resp: 'evaporación' }
    ]
  },
  '3': {
    instruccion: 'Química: responde cada pregunta.',
    items: [
      { texto: '¿Cuál es la partícula más pequeña de un elemento?', resp: 'el átomo' },
      { texto: '¿Cómo se llama la unión de dos o más átomos?', resp: 'molécula' },
      { texto: '¿Qué partícula del átomo tiene carga negativa?', resp: 'electrón' },
      { texto: '¿Cómo se llama la tabla que organiza los elementos químicos?', resp: 'tabla periódica' },
      { texto: '¿Cuál es el símbolo químico del agua?', resp: 'H₂O' },
      { texto: '¿Cómo se llama una sustancia formada por dos o más elementos combinados?', resp: 'compuesto' },
      { texto: '¿Qué tipo de reacción libera calor?', resp: 'exotérmica' },
      { texto: '¿Cuál es el pH de una sustancia neutra?', resp: '7' }
    ]
  }
};

function mostrarHoja() {
  const grado = gradoSelect.value;
  document.getElementById('gradoTexto').textContent = grado + '°';
  const banco = bancos[grado];
  instruccionTexto.textContent = banco.instruccion;
  const seleccion = mezclar(banco.items).slice(0, 6);
  problemasDiv.innerHTML = '';
  seleccion.forEach(p => {
    const div = document.createElement('div');
    div.className = 'problema';
    div.innerHTML = `${p.texto} <span class="linea"></span><span class="respuesta">${p.resp}</span>`;
    problemasDiv.appendChild(div);
  });
  hoja.classList.remove('mostrar-respuestas');
  document.getElementById('respuestasBtn').textContent = '👁️ Ver respuestas';
}

document.getElementById('generarBtn').onclick = mostrarHoja;
gradoSelect.onchange = mostrarHoja;
document.getElementById('imprimirBtn').onclick = () => window.print();
document.getElementById('respuestasBtn').onclick = () => {
  hoja.classList.toggle('mostrar-respuestas');
  document.getElementById('respuestasBtn').textContent = hoja.classList.contains('mostrar-respuestas') ? '🙈 Ocultar respuestas' : '👁️ Ver respuestas';
};

mostrarHoja();
</script>

</body>
</html>
