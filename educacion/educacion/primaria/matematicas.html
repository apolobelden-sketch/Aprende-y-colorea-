<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primaria - Matemáticas</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #fef9f0; margin: 0; padding: 20px; }
  h1 { color: #d35400; }
  .volver { display: inline-block; margin-bottom: 20px; color: #d35400; text-decoration: none; font-weight: bold; }
  .pregunta { background: white; border: 2px solid #d35400; border-radius: 12px; padding: 25px; max-width: 500px; margin: 20px auto; }
  .opcion { display: block; width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 2px solid #ccc; background: white; font-size: 16px; cursor: pointer; }
  .opcion:hover { border-color: #d35400; }
  .correcta { background: #2ecc71 !important; color: white; border-color: #2ecc71 !important; }
  .incorrecta { background: #e74c3c !important; color: white; border-color: #e74c3c !important; }
  #puntaje { font-size: 18px; font-weight: bold; color: #d35400; }
  #siguienteBtn { padding: 10px 20px; margin-top: 15px; border-radius: 8px; border: none; background: #27ae60; color: white; font-size: 15px; cursor: pointer; display: none; }
</style>
</head>
<body>

<a class="volver" href="../index.html">← Volver a materias</a>
<h1>➕ Primaria — Matemáticas</h1>
<p id="puntaje">Puntaje: 0 / 0</p>

<div class="pregunta" id="areaPregunta"></div>

<script>
const bancoPreguntas = [
  { texto: "¿Cuánto es 7 + 5?", opciones: ["10","12","13"], correcta: 1 },
  { texto: "¿Cuánto es 9 - 4?", opciones: ["5","6","4"], correcta: 0 },
  { texto: "¿Cuánto es 3 × 4?", opciones: ["7","12","10"], correcta: 1 },
  { texto: "¿Cuánto es 20 ÷ 5?", opciones: ["4","5","2"], correcta: 0 },
  { texto: "¿Cuánto es 8 + 6?", opciones: ["13","14","15"], correcta: 1 },
  { texto: "¿Cuánto es 15 - 7?", opciones: ["8","9","7"], correcta: 0 },
  { texto: "¿Cuánto es 6 × 3?", opciones: ["16","18","20"], correcta: 1 },
  { texto: "¿Cuánto es 24 ÷ 6?", opciones: ["3","4","6"], correcta: 1 },
  { texto: "¿Cuál número es mayor: 45 o 54?", opciones: ["45","54","Son iguales"], correcta: 1 },
  { texto: "¿Cuánto es 100 - 25?", opciones: ["75","65","85"], correcta: 0 },
  { texto: "¿Cuántas decenas tiene el número 67?", opciones: ["6","7","67"], correcta: 0 },
  { texto: "¿Cuánto es 9 × 2?", opciones: ["16","18","20"], correcta: 1 },
  { texto: "¿Cuánto es la mitad de 20?", opciones: ["5","10","15"], correcta: 1 },
  { texto: "¿Cuánto es 45 + 30?", opciones: ["65","75","85"], correcta: 1 },
  { texto: "¿Cuál es un número par?", opciones: ["7","10","13"], correcta: 1 },
  { texto: "¿Cuánto es 12 + 12?", opciones: ["22","24","26"], correcta: 1 },
  { texto: "¿Cuánto es 50 ÷ 10?", opciones: ["4","5","6"], correcta: 1 },
  { texto: "¿Cuánto es 7 × 5?", opciones: ["30","35","40"], correcta: 1 },
  { texto: "¿Cuál es un número impar?", opciones: ["8","12","15"], correcta: 2 },
  { texto: "¿Cuánto es 80 - 35?", opciones: ["45","55","35"], correcta: 0 },
  { texto: "¿Cuántas unidades tiene el número 92?", opciones: ["9","2","92"], correcta: 1 },
  { texto: "¿Cuánto es el doble de 15?", opciones: ["25","30","35"], correcta: 1 },
  { texto: "¿Cuánto es 4 × 8?", opciones: ["24","32","36"], correcta: 1 },
  { texto: "¿Cuánto es 63 ÷ 9?", opciones: ["6","7","8"], correcta: 1 },
  { texto: "Si tienes $50 y gastas $20, ¿cuánto te queda?", opciones: ["20","30","40"], correcta: 1 },
  { texto: "¿Cuántos lados tiene un triángulo?", opciones: ["3","4","5"], correcta: 0 },
  { texto: "¿Cuántos lados tiene un cuadrado?", opciones: ["3","4","5"], correcta: 1 },
  { texto: "¿Cuánto es 11 × 3?", opciones: ["31","33","36"], correcta: 1 },
  { texto: "Si son las 3:00 y pasa 1 hora, ¿qué hora es?", opciones: ["4:00","2:00","5:00"], correcta: 0 },
  { texto: "¿Cuántos días tiene una semana?", opciones: ["5","6","7"], correcta: 2 },
  { texto: "¿Cuánto es 5 + 5 + 5?", opciones: ["10","15","20"], correcta: 1 },
  { texto: "¿Cuánto es la tercera parte de 30?", opciones: ["10","15","3"], correcta: 0 },
  { texto: "Ana tiene 8 dulces y le da 3 a su amigo, ¿cuántos le quedan?", opciones: ["5","4","6"], correcta: 0 },
  { texto: "¿Cuánto es 90 ÷ 9?", opciones: ["9","10","11"], correcta: 1 },
  { texto: "¿Cuántos meses tiene un año?", opciones: ["10","12","11"], correcta: 1 },
  { texto: "¿Cuánto es 2 × 2 × 2?", opciones: ["6","8","4"], correcta: 1 },
  { texto: "¿Cuál es más grande: 1/2 o 1/4?", opciones: ["1/2","1/4","Son iguales"], correcta: 0 },
  { texto: "¿Cuánto es 100 ÷ 4?", opciones: ["20","25","30"], correcta: 1 },
  { texto: "Un carro tiene 4 llantas, ¿cuántas llantas hay en 3 carros?", opciones: ["10","12","14"], correcta: 1 },
  { texto: "¿Cuánto es 36 + 27?", opciones: ["63","53","73"], correcta: 0 },
  { texto: "¿Cuántos centímetros hay en 1 metro?", opciones: ["10","100","1000"], correcta: 1 },
  { texto: "¿Cuánto es 8 × 8?", opciones: ["54","64","74"], correcta: 1 },
  { texto: "¿Cuál número sigue en la secuencia: 2, 4, 6, 8, ___?", opciones: ["9","10","11"], correcta: 1 },
  { texto: "¿Cuánto es 99 - 45?", opciones: ["54","44","64"], correcta: 0 },
  { texto: "Si un libro cuesta $35 y compras 2, ¿cuánto pagas?", opciones: ["60","70","75"], correcta: 1 },
  { texto: "¿Cuántos lados tiene un hexágono?", opciones: ["5","6","7"], correcta: 1 },
  { texto: "¿Cuánto es 7 × 7?", opciones: ["47","49","51"], correcta: 1 },
  { texto: "¿Cuánto es 12 × 12?", opciones: ["124","144","134"], correcta: 1 }
];

function mezclar(arr) {
  const copia = [...arr];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

const preguntas = mezclar(bancoPreguntas).slice(0, 10);

let actual = 0;
let correctas = 0;

function mostrarPregunta() {
  const p = preguntas[actual];
  const area = document.getElementById('areaPregunta');
  area.innerHTML = `
    <p><strong>${p.texto}</strong></p>
    ${p.opciones.map((op, i) => `<button class="opcion" onclick="responder(${i})">${op}</button>`).join('')}
    <p id="resultado"></p>
    <button id="siguienteBtn" onclick="siguientePregunta()">Siguiente →</button>
  `;
}

function responder(indice) {
  const p = preguntas[actual];
  const botones = document.querySelectorAll('.opcion');
  botones.forEach(b => b.disabled = true);
  const esCorrecta = indice === p.correcta;
  botones[indice].classList.add(esCorrecta ? 'correcta' : 'incorrecta');
  if (!esCorrecta) botones[p.correcta].classList.add('correcta');
  document.getElementById('resultado').textContent = esCorrecta ? '¡Correcto! 🎉' : 'Casi, revisa la respuesta correcta.';
  if (esCorrecta) correctas++;
  document.getElementById('puntaje').textContent = `Puntaje: ${correctas} / ${actual + 1}`;
  document.getElementById('siguienteBtn').style.display = 'inline-block';
}

function siguientePregunta() {
  actual++;
  if (actual < preguntas.length) {
    mostrarPregunta();
  } else {
    document.getElementById('areaPregunta').innerHTML = `<p><strong>¡Terminaste! 🏆</strong></p><p>Puntaje final: ${correctas} / ${preguntas.length}</p>`;
  }
}

mostrarPregunta();
</script>

</body>
</html>
