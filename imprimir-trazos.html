<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprimir Trazos - Aprende a Escribir</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #fef9f0; margin: 0; padding: 20px; }
  h1 { color: #d35400; }
  .volver { display: inline-block; margin-bottom: 15px; color: #d35400; text-decoration: none; font-weight: bold; }
  .categorias { margin: 10px 0; }
  .categorias button { padding: 10px 16px; margin: 4px; border-radius: 8px; border: none; background: #95a5a6; color: white; font-size: 14px; cursor: pointer; }
  .categorias button.activa { background: #d35400; }
  #cuadricula { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 500px; margin: 12px auto; }
  #cuadricula button { width: 40px; height: 40px; border-radius: 8px; border: 2px solid #d35400; background: white; color: #d35400; font-size: 16px; font-weight: bold; cursor: pointer; }
  #cuadricula button.actual { background: #d35400; color: white; }
  #hojaContenedor { background: white; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); padding: 15px; margin: 15px auto; max-width: 95vw; display: inline-block; }
  canvas { max-width: 100%; height: auto; display: block; }
  .accion { padding: 10px 18px; margin: 5px; border-radius: 8px; border: none; background: #27ae60; color: white; font-size: 15px; cursor: pointer; }
  @media print {
    .no-imprimir { display: none; }
    body { background: white; padding: 0; }
    #hojaContenedor { box-shadow: none; margin: 0; }
  }
</style>
</head>
<body>

<a class="volver no-imprimir" href="index.html">← Volver al inicio</a>
<h1 class="no-imprimir">🖨️ Hojas de Trazos para Imprimir</h1>

<div class="no-imprimir">
  <div class="categorias">
    <button id="btnMayus" class="activa">Mayúsculas</button>
    <button id="btnMinus">minúsculas</button>
    <button id="btnNumeros">Números</button>
  </div>
  <div id="cuadricula"></div>
  <button class="accion" id="imprimirBtn" style="background:#8e44ad;">🖨️ Imprimir esta hoja</button>
</div>

<div id="hojaContenedor">
  <canvas id="lienzo" width="700" height="900"></canvas>
</div>

<script>
const canvas = document.getElementById('lienzo');
const ctx = canvas.getContext('2d');
const cuadricula = document.getElementById('cuadricula');

const conjuntos = {
  mayus: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
  minus: 'abcdefghijklmnopqrstuvwxyz'.split(''),
  numeros: '0123456789'.split('')
};

let conjuntoActual = 'mayus';
let indiceActual = 0;

function dibujarHoja() {
  const letra = conjuntos[conjuntoActual][indiceActual];
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Título de la hoja
  ctx.fillStyle = '#d35400';
  ctx.font = 'bold 30px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('Practica la letra: ' + letra, canvas.width / 2, 45);
  ctx.font = '16px Arial';
  ctx.fillStyle = '#888';
  ctx.fillText('Nombre: ______________________     Fecha: __________', canvas.width / 2, 75);

  // Filas de práctica: 6 filas, 5 repeticiones por fila
  const filas = 6, columnas = 5;
  const inicioY = 130;
  const altoFila = (canvas.height - inicioY - 30) / filas;
  const anchoColumna = canvas.width / columnas;

  ctx.textBaseline = 'middle';

  for (let f = 0; f < filas; f++) {
    const y = inicioY + f * altoFila + altoFila / 2;

    // Línea de renglón (guía de escritura)
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(30, y + altoFila * 0.3);
    ctx.lineTo(canvas.width - 30, y + altoFila * 0.3);
    ctx.stroke();

    for (let c = 0; c < columnas; c++) {
      const x = anchoColumna * c + anchoColumna / 2;
      ctx.font = `bold ${Math.floor(altoFila * 0.75)}px Arial`;
      ctx.textAlign = 'center';

      if (c === 0) {
        // Primera letra de la fila: sólida, como modelo
        ctx.setLineDash([]);
        ctx.fillStyle = '#d35400';
        ctx.fillText(letra, x, y);
      } else {
        // Las demás: punteadas para trazar
        ctx.setLineDash([8, 6]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#bbbbbb';
        ctx.strokeText(letra, x, y);
      }
    }
  }
  ctx.setLineDash([]);
}

function construirCuadricula() {
  cuadricula.innerHTML = '';
  conjuntos[conjuntoActual].forEach((letra, i) => {
    const btn = document.createElement('button');
    btn.textContent = letra;
    if (i === indiceActual) btn.classList.add('actual');
    btn.onclick = () => {
      indiceActual = i;
      dibujarHoja();
      construirCuadricula();
    };
    cuadricula.appendChild(btn);
  });
}

function cambiarCategoria(nueva, boton) {
  conjuntoActual = nueva;
  indiceActual = 0;
  document.querySelectorAll('.categorias button').forEach(b => b.classList.remove('activa'));
  boton.classList.add('activa');
  dibujarHoja();
  construirCuadricula();
}

document.getElementById('btnMayus').onclick = (e) => cambiarCategoria('mayus', e.target);
document.getElementById('btnMinus').onclick = (e) => cambiarCategoria('minus', e.target);
document.getElementById('btnNumeros').onclick = (e) => cambiarCategoria('numeros', e.target);

document.getElementById('imprimirBtn').onclick = () => {
  const ventana = window.open('');
  ventana.document.write('<img src="' + canvas.toDataURL() + '" style="width:100%">');
  ventana.print();
};

dibujarHoja();
construirCuadricula();
</script>

</body>
</html>
