<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorear - Plataforma Educativa</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #fef9f0; margin: 0; padding: 20px; }
  h1 { color: #d35400; }
  .volver { display: inline-block; margin-bottom: 15px; color: #d35400; text-decoration: none; font-weight: bold; }
  #buscador { padding: 10px; width: 250px; border-radius: 8px; border: 2px solid #d35400; font-size: 16px; }
  #buscarBtn { padding: 10px 15px; border-radius: 8px; border: none; background: #d35400; color: white; font-size: 16px; cursor: pointer; }
  #paleta { margin: 15px 0; }
  .color { width: 35px; height: 35px; display: inline-block; margin: 3px; border-radius: 50%; cursor: pointer; border: 2px solid #333; }
  #lienzoContenedor { display: inline-block; border: 3px solid #333; border-radius: 10px; background: white; }
  canvas { cursor: crosshair; max-width: 90vw; touch-action: none; }
  .accion { padding: 10px 18px; margin: 5px; border-radius: 8px; border: none; background: #27ae60; color: white; font-size: 15px; cursor: pointer; }
  #estado { color: #888; margin-top: 10px; }
  .subirLabel { display:inline-block; padding:10px 15px; background:#3498db; color:white; border-radius:8px; cursor:pointer; }
  .tip { font-size: 13px; color: #888; max-width: 400px; margin: 8px auto; }
  .enlaceHistorial { color: #d35400; font-weight: bold; text-decoration: none; }
</style>
</head>
<body>

<a class="volver" href="index.html">← Volver al inicio</a>
<h1>🎨 Colorea tu dibujo</h1>

<input type="text" id="buscador" placeholder="Ej: gato, perro, sol...">
<button id="buscarBtn">Buscar</button>
<p id="estado"></p>

<div style="margin: 10px 0;">
  <label for="subirArchivo" class="subirLabel">📤 Subir tu propia imagen</label>
  <input type="file" id="subirArchivo" accept="image/*" style="display:none;">
</div>
<p class="tip">💡 Tip: puedes generar tu dibujo gratis en tu propia app de Gemini (pídele: "un [lo que quieras] para colorear, solo contorno, línea negra"), descargarlo, y luego subirlo aquí para colorearlo e imprimirlo.</p>
<p><a class="enlaceHistorial" href="historial.html">🗂️ Ver mi historial</a></p>

<div id="galeriaContenedor" style="max-width:500px; margin:15px auto;">
  <div id="categorias" style="margin-bottom:10px;"></div>
  <div id="miniaturas" style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px;"></div>
</div>

<div style="margin: 10px 0;">
  <button class="accion" id="modoRellenarBtn" style="background:#d35400;">🪣 Rellenar</button>
  <button class="accion" id="modoPincelBtn" style="background:#95a5a6;">🖌️ Pincel</button>
  <button class="accion" id="modoBorradorBtn" style="background:#95a5a6;">🧹 Borrador</button>
  <span id="grosorContenedor" style="display:none; margin-left:8px;">
    <label style="font-size:13px; color:#888;">Grosor:</label>
    <input type="range" id="grosorPincel" min="2" max="30" value="8" style="vertical-align:middle;">
  </span>
</div>

<div id="paleta"></div>

<div>
  <button class="accion" id="zoomMenosBtn" style="background:#34495e; padding:8px 14px;">🔍−</button>
  <button class="accion" id="zoomMasBtn" style="background:#34495e; padding:8px 14px;">🔍+</button>
</div>

<div id="lienzoContenedor" style="max-width:90vw; max-height:65vh; overflow:auto;">
  <canvas id="lienzo" width="500" height="500"></canvas>
</div>

<br>
<button class="accion" id="descargarBtn">⬇️ Descargar</button>
<button class="accion" id="imprimirBtn">🖨️ Imprimir</button>
<button class="accion" id="reiniciarBtn">↺ Reiniciar</button>
<button class="accion" id="deshacerBtn" style="background:#e67e22;">↩️ Deshacer</button>
<button class="accion" id="guardarBtn" style="background:#8e44ad;">💾 Guardar en mi historial</button>
<button class="accion" id="compartirBtn" style="background:#16a085;">🌍 Compartir con la comunidad</button>
<br>
<button id="activarAdminBtn" style="background:none; border:none; color:#aaa; font-size:12px; text-decoration:underline; cursor:pointer; margin-top:5px;">🔑 Soy el administrador</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const canvas = document.getElementById('lienzo');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const estado = document.getElementById('estado');
let colorActual = '#e74c3c';

// Paleta de colores
const colores = ['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#e67e22','#1abc9c','#34495e','#ecf0f1','#000000'];
const paletaDiv = document.getElementById('paleta');
colores.forEach(c => {
  const btn = document.createElement('div');
  btn.className = 'color';
  btn.style.background = c;
  btn.onclick = () => colorActual = c;
  paletaDiv.appendChild(btn);
});
const colorLibre = document.createElement('input');
colorLibre.type = 'color';
colorLibre.value = '#e74c3c';
colorLibre.style = 'width:35px;height:35px;border-radius:50%;border:2px solid #333;vertical-align:middle;margin-left:5px;';
colorLibre.oninput = (e) => { colorActual = e.target.value; };
paletaDiv.appendChild(colorLibre);

// Supabase
const supabaseUrl = 'https://pnjglzuxsyahxcbgjwvq.supabase.co';
const supabaseKey = 'sb_publishable_f3roew_gvKiClDkdKYieYg_d0_7fWUk';
const supa = supabase.createClient(supabaseUrl, supabaseKey);

// Copia de la imagen original (para que el borrador revele el dibujo, no pinte blanco)
let datosOriginales = null;
function guardarOriginal() {
  datosOriginales = ctx.getImageData(0, 0, canvas.width, canvas.height);
}

// Diccionario de sinónimos: diminutivos y traducciones inglés/español
const diccionario = {
  gato: ['gato','gatito','gata','cat','kitten','kitty'],
  perro: ['perro','perrito','perra','dog','puppy','doggy'],
  conejo: ['conejo','conejito','coneja','rabbit','bunny'],
  pajaro: ['pájaro','pajaro','pajarito','ave','bird'],
  tortuga: ['tortuga','tortuguita','turtle','tortoise'],
  leon: ['león','leon','leoncito','lion'],
  elefante: ['elefante','elefantito','elephant'],
  pez: ['pez','pescado','peces','fish'],
  mariposa: ['mariposa','butterfly'],
  pato: ['pato','patito','pata','duck','duckling'],
  carro: ['carro','coche','auto','carrito','car'],
  avion: ['avión','avion','avioncito','plane','airplane'],
  barco: ['barco','barquito','bote','boat','ship'],
  tren: ['tren','trenecito','train'],
  bicicleta: ['bicicleta','bici','bicycle','bike'],
  camion: ['camión','camion','truck'],
  sol: ['sol','solecito','sun'],
  arbol: ['árbol','arbol','arbolito','tree'],
  flor: ['flor','florecita','flower'],
  luna: ['luna','lunita','moon'],
  estrella: ['estrella','estrellita','star'],
  nube: ['nube','nubecita','cloud'],
  princesa: ['princesa','princess'],
  robot: ['robot','robotcito'],
  dinosaurio: ['dinosaurio','dino','dinosaur'],
  unicornio: ['unicornio','unicorn'],
  superheroe: ['superhéroe','superheroe','superhero'],
  sirena: ['sirena','mermaid'],
  dibujo: ['dibujo','drawing','dibujito']
};

function normalizarTexto(t) {
  return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

const indiceInverso = {};
Object.keys(diccionario).forEach(canon => {
  diccionario[canon].forEach(variante => { indiceInverso[normalizarTexto(variante)] = canon; });
  indiceInverso[normalizarTexto(canon)] = canon;
});

function buscarInfoPalabra(texto) {
  const limpio = normalizarTexto(texto);
  const canon = indiceInverso[limpio];
  if (canon) return { canon, variantes: diccionario[canon], conocida: true };
  return { canon: limpio, variantes: [texto], conocida: false };
}

async function buscarEnCatalogo(texto) {
  const info = buscarInfoPalabra(texto);
  const orParts = info.conocida
    ? info.variantes.map(v => `palabra_clave.ilike.${v}`)
    : [`palabra_clave.ilike.%${texto}%`];
  const { data } = await supa
    .from('imagenes_catalogo')
    .select('url_imagen')
    .eq('estado', 'aprobado')
    .or(orParts.join(','))
    .limit(1);
  return data && data.length > 0 ? data[0].url_imagen : null;
}

// Cargar imagen: busca en el catálogo de la comunidad (ya no genera con IA)
async function cargarImagen(prompt) {
  document.getElementById('buscador').value = prompt;
  estado.textContent = 'Buscando...';

  const url = await buscarEnCatalogo(prompt);

  if (url) {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      guardarOriginal();
      estado.textContent = '¡Listo! Toca una zona para colorearla.';
    };
    img.src = url;
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f5f5f5';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#bbb';
    ctx.font = '20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Aún no hay un dibujo de', canvas.width / 2, canvas.height / 2 - 15);
    ctx.fillText('"' + prompt + '"', canvas.width / 2, canvas.height / 2 + 15);
    datosOriginales = null;
    estado.textContent = 'No encontramos ese dibujo todavía. ¡Sube el tuyo con el botón de arriba! 📤';
  }
}

// Historial de deshacer
let historialDeshacer = [];
function guardarHistorial() {
  historialDeshacer.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (historialDeshacer.length > 15) historialDeshacer.shift();
}
document.getElementById('deshacerBtn').onclick = () => {
  if (historialDeshacer.length > 0) {
    ctx.putImageData(historialDeshacer.pop(), 0, 0);
  }
};

// Flood fill (relleno por clic)
function colorearEn(x, y, colorRelleno) {
  guardarHistorial();
  const datos = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const pixeles = datos.data;
  const ancho = canvas.width;

  const hexANumeros = (hex) => {
    const bigint = parseInt(hex.slice(1), 16);
    return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255, 255];
  };
  const colorNuevo = hexANumeros(colorRelleno);
  const posInicial = (y * ancho + x) * 4;
  const colorOriginal = [pixeles[posInicial], pixeles[posInicial+1], pixeles[posInicial+2], pixeles[posInicial+3]];

  const parecidos = (a,b) => Math.abs(a[0]-b[0])<40 && Math.abs(a[1]-b[1])<40 && Math.abs(a[2]-b[2])<40;
  if (parecidos(colorOriginal, colorNuevo)) return;

  const pila = [[x,y]];
  while (pila.length) {
    const [px, py] = pila.pop();
    if (px < 0 || py < 0 || px >= canvas.width || py >= canvas.height) continue;
    const pos = (py * ancho + px) * 4;
    const colorActualPixel = [pixeles[pos], pixeles[pos+1], pixeles[pos+2], pixeles[pos+3]];
    if (!parecidos(colorActualPixel, colorOriginal)) continue;

    pixeles[pos] = colorNuevo[0];
    pixeles[pos+1] = colorNuevo[1];
    pixeles[pos+2] = colorNuevo[2];
    pixeles[pos+3] = 255;

    pila.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);
  }
  ctx.putImageData(datos, 0, 0);
}

// Modo: 'rellenar' o 'pincel'
let modo = 'rellenar';
let dibujando = false;
let ultimoPunto = null;

document.getElementById('modoRellenarBtn').onclick = () => {
  modo = 'rellenar';
  document.getElementById('modoRellenarBtn').style.background = '#d35400';
  document.getElementById('modoPincelBtn').style.background = '#95a5a6';
  document.getElementById('modoBorradorBtn').style.background = '#95a5a6';
  document.getElementById('grosorContenedor').style.display = 'none';
};
document.getElementById('modoPincelBtn').onclick = () => {
  modo = 'pincel';
  document.getElementById('modoPincelBtn').style.background = '#d35400';
  document.getElementById('modoRellenarBtn').style.background = '#95a5a6';
  document.getElementById('modoBorradorBtn').style.background = '#95a5a6';
  document.getElementById('grosorContenedor').style.display = 'inline';
};
document.getElementById('modoBorradorBtn').onclick = () => {
  modo = 'borrador';
  document.getElementById('modoBorradorBtn').style.background = '#d35400';
  document.getElementById('modoRellenarBtn').style.background = '#95a5a6';
  document.getElementById('modoPincelBtn').style.background = '#95a5a6';
  document.getElementById('grosorContenedor').style.display = 'inline';
};

function borrarEn(x, y, radio) {
  if (!datosOriginales) return;
  const r = Math.round(radio);
  const x0 = Math.max(0, x - r);
  const y0 = Math.max(0, y - r);
  const x1 = Math.min(canvas.width, x + r);
  const y1 = Math.min(canvas.height, y + r);
  const actual = ctx.getImageData(0, 0, canvas.width, canvas.height);
  for (let py = y0; py < y1; py++) {
    for (let px = x0; px < x1; px++) {
      if ((px - x) ** 2 + (py - y) ** 2 <= r * r) {
        const i = (py * canvas.width + px) * 4;
        actual.data[i] = datosOriginales.data[i];
        actual.data[i+1] = datosOriginales.data[i+1];
        actual.data[i+2] = datosOriginales.data[i+2];
        actual.data[i+3] = datosOriginales.data[i+3];
      }
    }
  }
  ctx.putImageData(actual, 0, 0);
}

function obtenerPosicion(e) {
  const rect = canvas.getBoundingClientRect();
  const escalaX = canvas.width / rect.width;
  const escalaY = canvas.height / rect.height;
  const clienteX = e.touches ? e.touches[0].clientX : e.clientX;
  const clienteY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: Math.floor((clienteX - rect.left) * escalaX),
    y: Math.floor((clienteY - rect.top) * escalaY)
  };
}

canvas.addEventListener('pointerdown', (e) => {
  const pos = obtenerPosicion(e);
  if (modo === 'rellenar') {
    colorearEn(pos.x, pos.y, colorActual);
  } else if (modo === 'pincel') {
    guardarHistorial();
    dibujando = true;
    ultimoPunto = pos;
    const grosor = document.getElementById('grosorPincel').value;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, grosor / 2, 0, Math.PI * 2);
    ctx.fillStyle = colorActual;
    ctx.fill();
  } else if (modo === 'borrador') {
    guardarHistorial();
    dibujando = true;
    const grosor = document.getElementById('grosorPincel').value;
    borrarEn(pos.x, pos.y, grosor / 2);
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!dibujando) return;
  const pos = obtenerPosicion(e);
  const grosor = document.getElementById('grosorPincel').value;
  if (modo === 'pincel') {
    ctx.strokeStyle = colorActual;
    ctx.lineWidth = grosor;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(ultimoPunto.x, ultimoPunto.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ultimoPunto = pos;
  } else if (modo === 'borrador') {
    borrarEn(pos.x, pos.y, grosor / 2);
  }
});

canvas.addEventListener('pointerup', () => { dibujando = false; });
canvas.addEventListener('pointerleave', () => { dibujando = false; });

document.getElementById('buscarBtn').onclick = () => {
  const valor = document.getElementById('buscador').value.trim();
  if (valor) cargarImagen(valor);
};

// Subir imagen propia
document.getElementById('subirArchivo').onchange = (e) => {
  const archivo = e.target.files[0];
  if (!archivo) return;
  const lector = new FileReader();
  lector.onload = (evento) => {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      guardarOriginal();
      estado.textContent = 'Imagen cargada. ¡Ya puedes colorearla!';
    };
    img.src = evento.target.result;
  };
  lector.readAsDataURL(archivo);
};

document.getElementById('descargarBtn').onclick = () => {
  const link = document.createElement('a');
  link.download = 'mi_dibujo_coloreado.png';
  link.href = canvas.toDataURL();
  link.click();
};

document.getElementById('imprimirBtn').onclick = () => {
  const ventana = window.open('');
  ventana.document.write('<img src="' + canvas.toDataURL() + '" style="width:100%">');
  ventana.print();
};

document.getElementById('reiniciarBtn').onclick = () => {
  const valor = document.getElementById('buscador').value.trim();
  if (valor) cargarImagen(valor);
};

// Guardar en historial local del dispositivo
document.getElementById('guardarBtn').onclick = () => {
  const dataURL = canvas.toDataURL('image/jpeg', 0.7);
  let historial = JSON.parse(localStorage.getItem('miHistorial') || '[]');
  historial.unshift({ imagen: dataURL, fecha: new Date().toLocaleString('es-MX') });
  if (historial.length > 20) historial.pop();
  try {
    localStorage.setItem('miHistorial', JSON.stringify(historial));
    estado.textContent = '¡Guardado en tu historial! 🗂️';
  } catch (err) {
    estado.textContent = 'Tu historial está lleno. Borra alguno en "Mi historial" primero.';
  }
};

// Compartir imagen al catálogo público
// Tu clave de administrador (guárdala solo tú) hace que tus propias subidas se publiquen directo, sin revisión.
// Cualquiera sin esta clave queda "pendiente" hasta que tú lo apruebes en Supabase.
const CLAVE_ADMIN = 'aprendecolorea2026';

document.getElementById('compartirBtn').onclick = async () => {
  const palabraCruda = document.getElementById('buscador').value.trim() || 'dibujo';
  const info = buscarInfoPalabra(palabraCruda);
  const palabra = info.conocida ? info.canon : palabraCruda;
  const dataURL = canvas.toDataURL('image/jpeg', 0.6);
  let claveGuardada = localStorage.getItem('claveAdmin') || '';
  estado.textContent = 'Enviando...';
  const { error } = await supa.rpc('compartir_imagen', {
    p_palabra_clave: palabra,
    p_url_imagen: dataURL,
    p_clave_admin: claveGuardada
  });
  if (error) {
    estado.textContent = 'No se pudo enviar, intenta de nuevo.';
  } else if (claveGuardada === CLAVE_ADMIN) {
    estado.textContent = '¡Publicado directo! 🌍';
  } else {
    estado.textContent = '¡Enviado! Se publicará cuando sea revisado. 🌱';
  }
};

document.getElementById('activarAdminBtn').onclick = () => {
  const clave = prompt('Escribe tu clave de administrador:');
  if (clave) {
    localStorage.setItem('claveAdmin', clave);
    estado.textContent = clave === CLAVE_ADMIN ? 'Clave guardada. Tus subidas ahora se publican directo.' : 'Clave guardada (revisa que esté bien escrita).';
  }
};

// Zoom
let zoomNivel = 1;
document.getElementById('zoomMasBtn').onclick = () => {
  zoomNivel = Math.min(3, zoomNivel + 0.25);
  canvas.style.width = (500 * zoomNivel) + 'px';
  canvas.style.height = (500 * zoomNivel) + 'px';
};
document.getElementById('zoomMenosBtn').onclick = () => {
  zoomNivel = Math.max(0.5, zoomNivel - 0.25);
  canvas.style.width = (500 * zoomNivel) + 'px';
  canvas.style.height = (500 * zoomNivel) + 'px';
};

// Galería de categorías (usa el catálogo real de la comunidad, ya no genera con IA)
const categoriasData = {
  'Animales': ['gato','perro','conejo','pajaro','tortuga','leon','elefante','pez','mariposa','pato'],
  'Vehículos': ['carro','avion','barco','tren','bicicleta','camion'],
  'Naturaleza': ['sol','arbol','flor','luna','estrella','nube'],
  'Personajes': ['princesa','robot','dinosaurio','unicornio','superheroe','sirena']
};

const categoriasDiv = document.getElementById('categorias');
const miniaturasDiv = document.getElementById('miniaturas');

async function mostrarMiniaturas(categoria) {
  miniaturasDiv.innerHTML = '<p style="grid-column:1/-1; color:#aaa; font-size:13px;">Cargando...</p>';
  const palabras = categoriasData[categoria];
  const urls = await Promise.all(palabras.map(p => buscarEnCatalogo(p)));
  miniaturasDiv.innerHTML = '';
  palabras.forEach((palabra, i) => {
    const etiqueta = diccionario[palabra] ? diccionario[palabra][0] : palabra;
    if (urls[i]) {
      const img = document.createElement('img');
      img.src = urls[i];
      img.alt = etiqueta;
      img.title = etiqueta;
      img.style = 'width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid #ddd;';
      img.onclick = () => cargarImagen(palabra);
      miniaturasDiv.appendChild(img);
    } else {
      const div = document.createElement('div');
      div.textContent = etiqueta;
      div.title = 'Aún no hay dibujo — toca para subir el tuyo';
      div.style = 'width:100%; aspect-ratio:1; border-radius:8px; cursor:pointer; border:2px dashed #ccc; background:#fafafa; color:#bbb; font-size:12px; display:flex; align-items:center; justify-content:center; text-align:center; padding:4px; box-sizing:border-box;';
      div.onclick = () => cargarImagen(palabra);
      miniaturasDiv.appendChild(div);
    }
  });
}

Object.keys(categoriasData).forEach((categoria, indice) => {
  const btn = document.createElement('button');
  btn.textContent = categoria;
  btn.className = 'accion';
  btn.style.background = indice === 0 ? '#d35400' : '#95a5a6';
  btn.style.fontSize = '13px';
  btn.style.padding = '8px 12px';
  btn.onclick = () => {
    document.querySelectorAll('#categorias button').forEach(b => b.style.background = '#95a5a6');
    btn.style.background = '#d35400';
    mostrarMiniaturas(categoria);
  };
  categoriasDiv.appendChild(btn);
});
mostrarMiniaturas(Object.keys(categoriasData)[0]);

// Imagen de bienvenida
cargarImagen('gato');
</script>

</body>
</html>
