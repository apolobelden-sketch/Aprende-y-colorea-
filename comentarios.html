<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comentarios de la comunidad</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #fef9f0; margin: 0; padding: 20px; }
  h1 { color: #d35400; }
  .volver { display: inline-block; margin-bottom: 20px; color: #d35400; text-decoration: none; font-weight: bold; }
  .form { background: white; border-radius: 12px; padding: 20px; max-width: 450px; margin: 0 auto 30px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
  .form input, .form textarea { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: 2px solid #ccc; font-size: 15px; box-sizing: border-box; }
  .form button { padding: 10px 20px; border-radius: 8px; border: none; background: #d35400; color: white; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .comentario { background: white; border-radius: 10px; padding: 15px; max-width: 450px; margin: 10px auto; text-align: left; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .comentario strong { color: #d35400; }
  #aviso { color: #16a085; font-weight: bold; }
</style>
</head>
<body>

<a class="volver" href="index.html">← Volver al inicio</a>
<h1>💬 Comentarios de la comunidad</h1>
<p style="color:#888; font-size:14px;">Espacio solo para padres/tutores. Todo comentario se revisa antes de publicarse.</p>

<div class="form">
  <input type="text" id="nombre" placeholder="Tu nombre (opcional)">
  <textarea id="contenido" rows="3" placeholder="Escribe tu comentario o aporte educativo..."></textarea>
  <button id="enviarBtn">Enviar para revisión</button>
  <p id="aviso"></p>
</div>

<div id="listaComentarios"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supa = supabase.createClient(
    'https://pnjglzuxsyahxcbgjwvq.supabase.co',
    'sb_publishable_f3roew_gvKiClDkdKYieYg_d0_7fWUk'
  );

  document.getElementById('enviarBtn').onclick = async () => {
    const nombre = document.getElementById('nombre').value.trim();
    const contenido = document.getElementById('contenido').value.trim();
    if (!contenido) return;
    const { error } = await supa.from('comentarios').insert({ nombre, contenido, referencia: 'general' });
    document.getElementById('aviso').textContent = error ? 'No se pudo enviar.' : '¡Gracias! Se publicará cuando sea revisado.';
    document.getElementById('contenido').value = '';
  };

  async function cargarComentarios() {
    const { data } = await supa
      .from('comentarios')
      .select('*')
      .eq('estado', 'aprobado')
      .order('creado_en', { ascending: false });

    const lista = document.getElementById('listaComentarios');
    lista.innerHTML = '';
    (data || []).forEach(c => {
      const div = document.createElement('div');
      div.className = 'comentario';
      div.innerHTML = `<strong>${c.nombre || 'Anónimo'}</strong><p>${c.contenido}</p>`;
      lista.appendChild(div);
    });
  }

  cargarComentarios();
</script>

</body>
</html>
