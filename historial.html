<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Historial</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; background: #fef9f0; margin: 0; padding: 20px; }
  h1 { color: #d35400; }
  .volver { display: inline-block; margin-bottom: 20px; color: #d35400; text-decoration: none; font-weight: bold; }
  #galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; max-width: 700px; margin: 0 auto; }
  .item { background: white; border-radius: 10px; padding: 10px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
  .item img { width: 100%; border-radius: 6px; }
  .item small { display: block; color: #999; margin: 6px 0; font-size: 11px; }
  .item button { border: none; background: #e74c3c; color: white; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; margin: 2px; }
  .item a.descargar { display: inline-block; background: #27ae60; color: white; border-radius: 6px; padding: 5px 10px; font-size: 12px; text-decoration: none; margin: 2px; }
  #vacio { color: #999; margin-top: 40px; }
</style>
</head>
<body>

<a class="volver" href="colorear.html">← Volver a colorear</a>
<h1>🗂️ Mi Historial</h1>

<div id="galeria"></div>
<p id="vacio" style="display:none;">Aún no has guardado ningún dibujo. ¡Colorea uno y guárdalo!</p>

<script>
function cargarGaleria() {
  const historial = JSON.parse(localStorage.getItem('miHistorial') || '[]');
  const galeria = document.getElementById('galeria');
  galeria.innerHTML = '';

  if (historial.length === 0) {
    document.getElementById('vacio').style.display = 'block';
    return;
  }
  document.getElementById('vacio').style.display = 'none';

  historial.forEach((item, indice) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <img src="${item.imagen}">
      <small>${item.fecha}</small>
      <a class="descargar" href="${item.imagen}" download="dibujo_${indice}.jpg">⬇️ Descargar</a>
      <button onclick="borrar(${indice})">🗑️ Borrar</button>
    `;
    galeria.appendChild(div);
  });
}

function borrar(indice) {
  let historial = JSON.parse(localStorage.getItem('miHistorial') || '[]');
  historial.splice(indice, 1);
  localStorage.setItem('miHistorial', JSON.stringify(historial));
  cargarGaleria();
}

cargarGaleria();
</script>

</body>
</html>
